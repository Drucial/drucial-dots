#!/usr/bin/env bash
# btop rewrites this whole file on exit, so only these keys are enforced; the rest stays btop's.
set -euo pipefail
awk '
  BEGIN {
    want["show_disks"] = "false"
    want["shown_boxes"] = "\"cpu proc mem\""
    want["theme_background"] = "false"
    want["color_theme"] = "\"zen-ink\""
  }
  {
    key = $1
    if (key in want && $2 == "=") { print key " = " want[key]; done[key] = 1; next }
    print
  }
  END { for (k in want) if (!(k in done)) print k " = " want[k] }
'
