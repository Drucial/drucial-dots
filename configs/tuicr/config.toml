theme = "rose-pine-moon"

diff_view = "side-by-side"
ignore_whitespace = false
show_file_list = true
mouse = true
leader = " "
comment_vim = false
comment_tab_width = 4
wrap = false
cursor_line = true
transparent_background = true
scroll_offset = 5
no_update_check = false
review_watch_interval_ms = 1000

backend = "libgit2"

comment_types = [
  { id = "note", label = "question", definition = "ask for clarification" },
  { id = "suggestion", definition = "possible improvements" },
  { id = "issue", definition = "problems to fix" },
  { id = "praise", definition = "positive feedback" },
  { id = "nit", label = "nitpick", definition = "small optional tweaks", color = "#f6c177" },
]

[forge]
comment_type_prefix = true

# [export] customization (intro, headers, legend) exists only in unreleased
# tuicr — 0.19.1 warns "Unknown config key 'export'". Restore after the next
# release ships it.
