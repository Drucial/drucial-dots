# Rosé Pine Moon for tuicr.
#
# tuicr ships no rose-pine variant, so this is a local theme: flat TOML, one
# file per theme, loaded from this `themes/` directory. Select it with
# `theme = "rose-pine-moon"` in ../config.toml or `tuicr --theme rose-pine-moon`.
# Every key below except `syntax_theme` is required — tuicr validates at load.
#
# Rosé Pine's darker base with Moon's tokens, matching the rest of the setup
# (see configs/zen-term/themes/rose-pine-moon):
#   base #191724   surface #1f1d2e   overlay #26233a
#   muted #6e6a86  subtle #908caa    text #e0def4
#   highlight low #21202e  med #403d52  high #524f67
#   love #eb6f92   gold #f6c177      rose #ea9a97   (Moon rose)
#   pine #3e8fb0   foam #9ccfd8      iris #c4a7e7   (Moon pine)
#
# Rosé Pine has no green, so adds read cool (foam) and deletes warm (love)
# rather than the usual green/red. That is the palette working as intended.

# Surfaces and text.
panel_bg = "#191724"       # base — note config.toml sets transparent_background,
                           # which lets the terminal show through and wins over this
bg_highlight = "#403d52"   # highlight med
fg_primary = "#e0def4"     # text        — 13.4:1 on base
fg_secondary = "#908caa"   # subtle      — 5.5:1
fg_dim = "#6e6a86"         # muted       — 3.4:1

# Diff body. The two backgrounds are foam and love blended 22% over base, which
# keeps body text at 8.0:1 and 9.5:1 while staying distinct from the panel.
diff_add = "#9ccfd8"           # foam
diff_add_bg = "#363f4c"
diff_del = "#eb6f92"           # love
diff_del_bg = "#472a3c"
diff_context = "#e0def4"       # text
diff_hunk_header = "#c4a7e7"   # iris
expanded_context_fg = "#6e6a86"

# Syntax-highlighted diff backgrounds — same blends, so the two views agree.
syntax_add_bg = "#363f4c"
syntax_del_bg = "#472a3c"

# Without this, tuicr falls back to a bundled dark .tmTheme whose greens and
# oranges are nowhere in this palette, and the code stops matching its chrome.
# Resolved relative to this file.
syntax_theme = "rose-pine-moon-syntax.tmTheme"

# File list status.
file_added = "#9ccfd8"     # foam
file_modified = "#f6c177"  # gold
file_deleted = "#eb6f92"   # love
file_renamed = "#c4a7e7"   # iris
reviewed = "#3e8fb0"       # pine — the one role pine owns alone
pending = "#f6c177"        # gold

# Comment types. These four appear side by side, so they take four distinct
# hues; the `nit` type in config.toml overrides its own color separately.
comment_note = "#9ccfd8"        # foam  (labelled "question")
comment_suggestion = "#c4a7e7"  # iris
comment_issue = "#eb6f92"       # love
comment_praise = "#ea9a97"      # rose

# Chrome.
border_focused = "#c4a7e7"   # iris
border_unfocused = "#403d52" # highlight med — overlay #26233a sits at 1.2:1 on
                             # this darker base, too faint to read as a border
status_bar_bg = "#1f1d2e"    # surface — one step up from base
cursor_color = "#ea9a97"     # rose
cursor_line_bg = "#21202e"   # highlight low, for config's cursor_line = true
branch_name = "#c4a7e7"      # iris
help_indicator = "#908caa"   # subtle

# Messages and badges: base as the foreground on a saturated ground, 6.1:1 at
# the worst (love) and 10.8:1 at the best (gold).
message_info_fg = "#191724"
message_info_bg = "#9ccfd8"
message_warning_fg = "#191724"
message_warning_bg = "#f6c177"
message_error_fg = "#191724"
message_error_bg = "#eb6f92"
update_badge_fg = "#191724"
update_badge_bg = "#f6c177"

mode_fg = "#191724"
mode_bg = "#c4a7e7"
