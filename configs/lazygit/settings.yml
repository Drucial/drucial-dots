# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
#
# Settings only. bin/lazygit-theme concatenates this with a theme generated from
# the current Omarchy palette and writes the result to config.yml, which is what
# lazygit actually reads. Edit this file, never config.yml.
gui:
  nerdFontsVersion: "3"
  filterMode: fuzzy
  showNumstatInFilesView: true
  showDivergenceFromBaseBranch: arrowAndNumber
