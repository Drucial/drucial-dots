# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
#
# Settings only. The lazygit-theme script beside this file concatenates it with
# a theme derived from the terminal's own background and foreground, and
# writes the result to config.yml, which is what lazygit actually reads. Edit
# this file, never config.yml.
gui:
  nerdFontsVersion: "3"
  filterMode: fuzzy
  showNumstatInFilesView: true
  showDivergenceFromBaseBranch: arrowAndNumber
